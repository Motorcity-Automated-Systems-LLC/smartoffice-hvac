<form action="/" method="POST" class="grid">
    {% for zone_name, data in zones.items() %}
    <div class="card">
        <h2>{{ zone_name.replace('_', ' ') }}</h2>
        <div class="stat">Target: {{ data.target }}{{ data.unit }}</div>
        <div class="stat" style="color: var(--accent-blue)">Actual: {{ data.actual }}{{ data.unit }}</div>
        
        <input type="range" name="{{ zone_name.lower() }}" 
               min="400" max="1500" step="5" 
               value="{{ data.target }}">
    </div>
    {% endfor %}
    
    <button type="submit">Sync Infrastructure Targets</button>
</form>
