name: Facility Automation CI/CD

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-code:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 bacpypes3

      - name: Lint Python Automation Core
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 src/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # General style check
          flake8 src/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  verify-markdown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Verify Documentation Links & Structure
        run: |
          echo "Verifying markdown structural files exist..."
          test -f README.md
          test -f docs/network_topology.md
          test -f docs/soo.md
          echo "Core documentation verified successfully."
